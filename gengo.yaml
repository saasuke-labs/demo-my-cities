# My Cities: a demo site for Gengo, Nagare and Kotomi.
# Build it with:  gengo generate --manifest gengo.yaml --output dist --plain
# The whole site is explained at /how-its-made/.

title: My Cities

# Free-form values every template can read with {{ index .Metadata "key" }}.
# A page's own front matter metadata is merged on top of these.
metadata:
  description: A six-city travel notebook, built to show what Gengo, Nagare and Kotomi can do together.
  # Only used for absolute URLs in social cards. Every link in the site is relative.
  site-url: https://saasuke-labs.com/demo-my-cities/
  # Kotomi is not released yet. Leave kotomi-url empty to show the preview
  # block; set it to your Kotomi server to load the real widget.
  kotomi-url: ""
  kotomi-site: my-cities

# The HTML shell around every page, and the template for index.html.
default-layout-template: layouts/layout.html
home-template: layouts/home.html

# Copied as they are.
static-assets:
  - path: static
    destination: static

# Where the pages come from. Title, flags, metadata and data are read from
# each file's front matter. The section name becomes the folder in the output.
content:
  cities:
    files:
      - content/cities/barcelona.md
      - content/cities/tokyo.md
      - content/cities/new-york.md
      - content/cities/rome.md
      - content/cities/sydney.md
      - content/cities/paris.md
  how-its-made:
    files: content/how-its-made/index.md

# Which templates each section uses.
sections:
  cities:
    template: layouts/cities.html # the section index, /cities/
    page-template: layouts/city.html # wraps each city's Markdown
    metadata:
      page-title: The cities
  how-its-made:
    page-template: layouts/article.html

# HTTP services pages can read while the site builds. The URL is a Go template
# rendered with the page's metadata, so one source serves all six cities.
sources:
  weather:
    url: 'https://api.open-meteo.com/v1/forecast?latitude={{ index .Metadata "lat" }}&longitude={{ index .Metadata "lon" }}&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=10'
    headers:
      Accept: application/json
