name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  # Once a day, so the weather on the city pages stays current.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  # The Gengo commit this site is built with. The site uses front matter,
  # `content` file lists and `sources`, which are on Gengo's main branch but
  # not in a tagged release yet. Once they are released, the two "Gengo" steps
  # below can be replaced by the install script:
  #   curl -fsSL https://raw.githubusercontent.com/saasuke-labs/gengo/main/install/install.sh | bash
  GENGO_REF: 229501850b81e0a289c8ff8c58fedef150ad2507

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Check out Gengo
        uses: actions/checkout@v4
        with:
          repository: saasuke-labs/gengo
          ref: ${{ env.GENGO_REF }}
          path: .gengo

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .gengo/go.mod
          cache-dependency-path: .gengo/go.sum

      - name: Build Gengo
        working-directory: .gengo
        run: go build -o "$RUNNER_TEMP/gengo" ./cmd/main.go

      # Each city page fetches its weather during the build. On a fresh runner
      # those requests have timed out, so make one request first, then rebuild
      # if any page still came out without its weather. If the service stays
      # down, the last build is published with the fallback text instead.
      - name: Build the site
        run: |
          curl -fsS -o /dev/null --retry 4 --retry-all-errors --retry-delay 5 --max-time 20 \
            'https://api.open-meteo.com/v1/forecast?latitude=0&longitude=0&current=temperature_2m' \
            || echo "::warning::Open-Meteo did not answer the warm-up request"

          for attempt in 1 2 3; do
            rm -rf dist
            "$RUNNER_TEMP/gengo" generate --manifest gengo.yaml --output dist --plain \
              | grep -E '^(File|Generated|Warning)' | tee "$RUNNER_TEMP/build.log"
            if ! grep -q '^Warning: failed to fetch source' "$RUNNER_TEMP/build.log"; then
              break
            fi
            echo "::warning::Attempt $attempt: some weather requests failed"
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done

      # A page that is missing, or a chart that failed to render, stops the
      # deploy here, so the last good version stays online.
      - name: Check the output
        run: |
          for page in index.html cities/index.html how-its-made/index.html \
            cities/barcelona.html cities/tokyo.html cities/new-york.html \
            cities/rome.html cities/sydney.html cities/paris.html; do
            test -s "dist/$page" || { echo "::error::missing dist/$page"; exit 1; }
          done
          if grep -rl 'nagare-error' dist --include='*.html'; then
            echo "::error::a Nagare block failed to render in the pages listed above"
            exit 1
          fi

      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Only main is published; a manual run on another branch just builds.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
